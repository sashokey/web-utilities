<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Generate passwords from words or random characters on your device."
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"

    <title>Phrase — Memorable Password Generator</title>

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23282828'/%3E%3Ctext x='18' y='47' fill='%23efefef' font-family='Georgia' font-size='51'%3Ep%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --paper: #101010;
        --surface: #111111;
        --ink: #efefef;
        --muted: #a0a0a0;
        --line: #414141;
        --soft-surface: #282828;
        --hover-surface: #2a2a2a;
        --password-surface: #131313;
        --focus: #b7b7b7;
        --token-separator: var(--muted);
        --token-number: var(--focus);
        --token-symbol: var(--focus);
        --strength-strong: var(--ink);
        --strength-moderate: var(--focus);
        --strength-moderate-surface: #232323;
        --strength-weak: var(--muted);
        --strength-weak-surface: var(--password-surface);
        --meter-optimum: var(--ink);
        --meter-suboptimum: var(--muted);
        --meter-low: #707070;
        --primary: var(--ink);
        --primary-hover: #fff;
        --primary-text: var(--paper);
        --feedback-error: var(--ink);
        --feedback-success: var(--focus);
        --control-accent: var(--ink);
        --switch-off: var(--line);
        --switch-on: var(--muted);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      select,
      input[type="range"],
      .toggle-row {
        cursor: pointer;
      }
      button:disabled,
      select:disabled {
        color: var(--muted);
      }
      button:disabled {
        cursor: not-allowed;
      }
      select:disabled {
        cursor: default;
      }
      ::selection {
        background: var(--primary);
        color: var(--primary-text);
      }
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }

      .shell {
        width: min(100% - 40px, 880px);
        margin-inline: auto;
        padding-block: clamp(24px, 7vw, 76px) 32px;
      }
      h1 {
        margin: 0 0 20px;
        font-size: clamp(26px, 4vw, 38px);
        font-weight: 650;
        letter-spacing: -0.035em;
      }

      .generator-card {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
      }
      .result-panel,
      .settings-panel {
        min-width: 0;
        padding: clamp(16px, 3.3vw, 28px);
      }

      .password-box {
        position: relative;
        display: flex;
        align-items: center;
        min-height: 88px;
        padding: 16px 52px 16px 16px;
        background: var(--password-surface);
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      .password-display {
        width: 100%;
        font-size: clamp(20px, 3vw, 26px);
        font-weight: 550;
        line-height: 1.4;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        user-select: all;
      }
      .password-display.is-hidden {
        letter-spacing: 3px;
        color: var(--muted);
      }
      .password-display.is-error {
        font-size: 16px;
      }
      .token-separator {
        color: var(--token-separator);
      }
      .token-number {
        color: var(--token-number);
      }
      .token-symbol {
        color: var(--token-symbol);
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
      }
      .icon-button:hover:not(:disabled) {
        background: var(--hover-surface);
      }
      .icon-button svg {
        width: 22px;
        height: 22px;
      }
      .visibility-button {
        position: absolute;
        top: 8px;
        right: 8px;
      }
      .eye-slash {
        display: none;
      }
      .visibility-button[aria-pressed="true"] .eye-slash {
        display: block;
      }

      .strength-summary {
        margin-block: 12px;
      }
      .strength-topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .strength-badge {
        padding: 3px 8px;
        border-radius: 12px;
        background: var(--soft-surface);
        color: var(--strength-strong);
        font-weight: 600;
      }
      .strength-badge[data-level="moderate"] {
        background: var(--strength-moderate-surface);
        color: var(--strength-moderate);
      }
      .strength-badge[data-level="weak"] {
        background: var(--strength-weak-surface);
        color: var(--strength-weak);
      }
      meter {
        display: block;
        width: 100%;
        height: 8px;
        margin-top: 8px;
      }
      meter::-webkit-meter-bar {
        background: var(--soft-surface);
        border: 0;
        border-radius: 8px;
      }
      meter::-webkit-meter-optimum-value {
        background: var(--meter-optimum);
      }
      meter::-webkit-meter-suboptimum-value {
        background: var(--meter-suboptimum);
      }
      meter::-webkit-meter-even-less-good-value {
        background: var(--meter-low);
      }
      meter::-moz-meter-bar {
        background: var(--meter-optimum);
      }

      .action-row {
        display: flex;
        gap: 8px;
      }
      .button {
        flex: 1;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft-surface);
        font-size: 13px;
        font-weight: 600;
      }
      .button svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .button:hover:not(:disabled) {
        background: var(--hover-surface);
      }
      .button-primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-text);
      }
      .button-primary:hover:not(:disabled) {
        background: var(--primary-hover);
      }
      .button-primary:disabled {
        background: var(--soft-surface);
        border-color: var(--line);
      }
      .feedback {
        margin: 0;
        font-size: 12px;
      }
      .feedback:not(:empty) {
        margin-top: 10px;
      }
      .feedback[data-tone="error"],
      .error-message {
        color: var(--feedback-error);
      }
      .feedback[data-tone="success"] {
        color: var(--feedback-success);
      }
      .memory-cue {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .settings-panel {
        border-left: 1px solid var(--line);
      }
      .length-heading,
      .select-row,
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 13px;
      }
      .length-heading input,
      select {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        padding: 7px 8px;
      }
      .length-heading input {
        width: 70px;
        background: var(--paper);
        text-align: center;
        font-weight: 600;
      }
      input[type="range"] {
        display: block;
        width: 100%;
        margin: 8px 0 12px;
        accent-color: var(--control-accent);
      }
      .select-row + .select-row {
        margin-top: 8px;
      }
      select {
        width: min(155px, 62%);
        min-width: 0;
      }
      .toggle-list {
        display: grid;
        gap: 8px;
        border-top: 1px solid var(--line);
        margin-top: 14px;
        padding-top: 10px;
      }
      .toggle-row {
        position: relative;
        min-height: 25px;
      }
      .toggle-row input {
        position: absolute;
        right: 0;
        width: 34px;
        height: 24px;
        opacity: 0;
        margin: 0;
        cursor: pointer;
      }
      .switch {
        position: relative;
        width: 34px;
        height: 20px;
        border-radius: 20px;
        background: var(--switch-off);
        flex: none;
        pointer-events: none;
      }
      .switch::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        top: 3px;
        left: 3px;
        border-radius: 50%;
        background: var(--ink);
      }
      .toggle-row input:checked + .switch {
        background: var(--switch-on);
      }
      .toggle-row input:checked + .switch::after {
        background: var(--paper);
        transform: translateX(14px);
      }
      .toggle-row input:focus-visible + .switch {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      .clipboard-helper {
        position: fixed;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      @media (max-width: 640px) {
        .shell {
          width: calc(100% - 32px);
        }
        .generator-card {
          grid-template-columns: minmax(0, 1fr);
        }
        .settings-panel {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1>Password Generator</h1>

      <div class="generator-card">
        <section class="result-panel" aria-label="Generated password">
          <div class="password-box">
            <div
              id="password-display"
              class="password-display"
              role="textbox"
              aria-readonly="true"
              aria-multiline="true"
              aria-label="Generated passphrase"
              tabindex="0"
            >
              Generating…
            </div>
            <button
              class="icon-button visibility-button"
              id="visibility-button"
              type="button"
              aria-label="Hide passphrase"
              aria-pressed="false"
              title="Hide passphrase"
              disabled
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                aria-hidden="true"
              >
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
                <path class="eye-slash" d="m3 3 18 18" />
              </svg>
            </button>
          </div>
          <div class="strength-summary">
            <div class="strength-topline">
              <span class="strength-badge" id="strength-badge">—</span
              ><span><strong id="entropy-value">—</strong> bits</span>
            </div>
            <meter
              id="strength-meter"
              min="0"
              max="140"
              low="80"
              high="100"
              optimum="140"
              value="0"
              aria-label="Estimated entropy in bits"
            ></meter>
          </div>
          <div class="action-row">
            <button
              class="button button-primary"
              id="copy-button"
              type="button"
              disabled
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                aria-hidden="true"
              >
                <rect x="8" y="8" width="12" height="13" rx="2" />
                <path
                  d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"
                /></svg
              ><span id="copy-label">Copy</span>
            </button>
            <button
              class="button button-secondary"
              id="generate-button"
              type="button"
              disabled
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                aria-hidden="true"
              >
                <path d="M20 7v5h-5M4 17v-5h5" />
                <path
                  d="M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"
                /></svg
              >Generate
            </button>
          </div>
          <p
            class="feedback"
            id="feedback"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></p>
          <p class="memory-cue" id="memory-cue" hidden></p>
          <noscript
            ><p class="error-message">
              Enable JavaScript to generate a password.
            </p></noscript
          >
        </section>

        <form
          id="settings-form"
          class="settings-panel"
          aria-label="Password settings"
          autocomplete="off"
        >
          <div class="length-heading">
            <label for="password-length">Password length</label
            ><input
              id="password-length"
              name="length"
              type="number"
              step="1"
              inputmode="numeric"
              required
            />
          </div>
          <input
            id="length-range"
            type="range"
            step="1"
            aria-label="Password length in characters"
          />
          <div class="select-row">
            <label for="phrase-style">Style</label
            ><select id="phrase-style">
              <option value="story" selected>Story phrase</option>
              <option value="random">Random words</option>
              <option value="characters">Random characters</option>
            </select>
          </div>
          <div class="select-row">
            <label for="vocabulary">Vocabulary</label
            ><select id="vocabulary">
              <option value="expanded" selected>Expanded</option>
              <option value="everyday">Familiar</option>
            </select>
          </div>
          <div class="select-row">
            <label for="separator">Separator</label
            ><select id="separator" name="separator">
              <option value="-">Hyphen ( - )</option>
              <option value=".">Period ( . )</option>
              <option value="_">Underscore ( _ )</option>
              <option value=" ">Space</option>
            </select>
          </div>
          <div class="toggle-list">
            <label class="toggle-row"
              ><span id="uppercase-label">Random word initials</span
              ><input
                id="capitalize"
                type="checkbox"
                role="switch"
                checked /><span class="switch" aria-hidden="true"></span
            ></label>
            <label class="toggle-row"
              ><span id="number-label">Add a number</span
              ><input
                id="include-number"
                type="checkbox"
                role="switch"
                checked /><span class="switch" aria-hidden="true"></span
            ></label>
            <label class="toggle-row"
              ><span id="symbol-label">Add a symbol</span
              ><input
                id="include-symbol"
                type="checkbox"
                role="switch"
                checked /><span class="switch" aria-hidden="true"></span
            ></label>
          </div>
        </form>
      </div>
    </main>

            ) {
              throw new Error(
                "Secure randomness is unavailable. Open this page in an up-to-date browser.",
              );
            }
            if (max === 1n) return 0n;
            const bits = (max - 1n).toString(2).length;
            const buffer = new Uint8Array(Math.ceil(bits / 8));
            const mask = 255 >>> (buffer.length * 8 - bits);
            let value;
            do {
              this.crypto.getRandomValues(buffer);
              buffer[0] &= mask;
              value = 0n;
              for (const byte of buffer) value = (value << 8n) | BigInt(byte);
            } while (value >= max);
            return value;
          }

          integer(max) {
            if (!Number.isSafeInteger(max) || max < 1)
              throw new RangeError("Invalid random range.");
            return Number(this.bigInt(BigInt(max)));
          }
        }

        class WordPool {
          constructor(words) {
            if (
              !words.length ||
              new Set(words).size !== words.length ||
              words.some((word) => !/^[a-z]+$/.test(word))
            ) {
              throw new Error("The word list is invalid.");
            }
            this.words = Object.freeze([...words]);
            const groups = new Map();
            for (const word of words) {
              if (!groups.has(word.length)) groups.set(word.length, []);
              groups.get(word.length).push(word);
            }
            this.groups = Object.freeze(
              [...groups]
                .sort(([a], [b]) => a - b)
                .map(([length, values]) =>
                  Object.freeze({ length, words: Object.freeze(values) }),
                ),
            );
          }
        }

        class WordRepository {
          constructor(pools) {
            this.pools = Object.fromEntries(
              Object.entries(pools).map(([name, words]) => [
                name,
                new WordPool(words.split(" ")),
              ]),
            );
            for (const word of ["the", "can", "near", "while"])
              this.pools[word] = new WordPool([word]);
          }

          get(name) {
            if (!this.pools[name]) throw new Error("Unknown word category.");
            return this.pools[name];
          }
        }

        class SequenceSpace {
          constructor(pools, kind) {
            this.pools = pools;
            this.kind = kind;
            this.memo = pools.map(() => new Map());
            this.minimum = new Array(pools.length + 1).fill(0);
            this.maximum = new Array(pools.length + 1).fill(0);
            for (let i = pools.length - 1; i >= 0; i -= 1) {
              const separator = i < pools.length - 1 ? 1 : 0;
              this.minimum[i] =
                pools[i].groups[0].length + separator + this.minimum[i + 1];
              this.maximum[i] =
                pools[i].groups.at(-1).length + separator + this.maximum[i + 1];
            }
          }

          count(index, remaining) {
            if (index === this.pools.length) return remaining === 0 ? 1n : 0n;
            if (
              remaining < this.minimum[index] ||
              remaining > this.maximum[index]
            )
              return 0n;
            if (this.memo[index].has(remaining))
              return this.memo[index].get(remaining);
            const separator = index < this.pools.length - 1 ? 1 : 0;
            let total = 0n;
            for (const group of this.pools[index].groups) {
              total +=
                BigInt(group.words.length) *
                this.count(index + 1, remaining - group.length - separator);
            }
            this.memo[index].set(remaining, total);
            return total;
          }

          unrank(rank, remaining) {
            if (
              typeof rank !== "bigint" ||
              rank < 0n ||
              rank >= this.count(0, remaining)
            )
              throw new RangeError("Invalid phrase index.");
            const words = [];
            for (let index = 0; index < this.pools.length; index += 1) {
              const separator = index < this.pools.length - 1 ? 1 : 0;
              for (const group of this.pools[index].groups) {
                const rest = remaining - group.length - separator;
                const completions = this.count(index + 1, rest);
                const weight = BigInt(group.words.length) * completions;
                if (rank >= weight) {
                  rank -= weight;
                  continue;
                }
                words.push(group.words[Number(rank / completions)]);
                rank %= completions;
                remaining = rest;
                break;
              }
            }
            return words;
          }
        }

        class PhrasePlanner {
          constructor(lexicon) {
            this.lexicon = lexicon;
            this.collections = new Map();
            this.plans = new Map();
          }

          collection(vocabulary) {
            if (this.collections.has(vocabulary))
              return this.collections.get(vocabulary);
            const repository = new WordRepository(this.lexicon[vocabulary]);
            const create = (names, kind = "sentence") =>
              new SequenceSpace(
                names.map((name) => repository.get(name)),
                kind,
              );
            const short = ["shortActor", "intransitive"];
            const action = ["shortActor", "verb", "object"];
            const descriptive = [
              "actorAdjective", "actor", "verb", "objectAdjective", "object",
            ];
            const manner = [
              "actorAdjective", "actor", "adverb", "verb", "objectAdjective", "object",
            ];
            const place = ["near", "the", "place"];
            const detailedPlace = ["near", "the", "placeAdjective", "place"];
            const story = [
              short,
              action,
              ["actorAdjective", "actor", "intransitive"],
              ["actorAdjective", "actor", "verb", "object"],
              ["actor", "adverb", "verb", "object"],
              descriptive,
              manner,
              [...action, ...detailedPlace],
              [...descriptive, ...place],
              [...descriptive, ...detailedPlace],
              [...manner, ...detailedPlace],
              [...descriptive, "while", ...descriptive],
              [...descriptive, "while", ...manner],
              [...descriptive, "while", ...descriptive, ...place],
            ].map((names) => create(names));
            const result = {
              story,
              compact: [
                create(["objectAdjective", "object"], "phrase"),
                create(["actorAdjective", "compactActor"], "phrase"),
                create(["placeAdjective", "compactPlace"], "phrase"),
                create(["compactVerb", "object"], "sentence"),
                create(["compactModifier", "compactNoun"], "phrase"),
                create(["the", "compactModifier", "compactNoun"], "phrase"),
                create(["the", "objectAdjective", "object"], "phrase"),
                create(["the", "placeAdjective", "compactPlace"], "phrase"),
                create(["all"], "word"),
              ],
              random: Array.from({ length: Math.floor((PASSWORD_LENGTH.max + 1) / 2) }, (_, i) =>
                create(new Array(i + 1).fill("all"), "random"),
              ),
            };
            this.collections.set(vocabulary, result);
            return result;
          }

          plan(options, budget) {
            const key = `${options.vocabulary}:${options.style}:${budget}:${options.capitalize}:${options.includeNumber}:${options.includeSymbol}`;
            if (this.plans.has(key)) return this.plans.get(key);
            const collection = this.collection(options.vocabulary);
            const candidates =
              options.style === "story"
                ? [
                    options.length < PASSWORD_LENGTH.initial
                      ? [...collection.story, ...collection.compact]
                      : collection.story,
                    collection.compact,
                  ]
                : [collection.random.filter((space) => budget > space.pools.length * 2 - 1)];
            for (const spaces of candidates) {
              const entries = spaces
                .map((space) => {
                  const layouts = WordLayout.count(space.pools.length, options);
                  const cases = options.capitalize
                    ? (1n << BigInt(space.pools.length)) - 1n
                    : 1n;
                  return {
                    space,
                    layouts,
                    cases,
                    count: space.count(0, budget) * layouts * cases,
                  };
                })
                .filter((entry) => entry.count > 0n);
              const total = entries.reduce(
                (sum, entry) => sum + entry.count,
                0n,
              );
              if (total) {
                const result = Object.freeze({ entries, total, budget });
                this.plans.set(key, result);
                return result;
              }
            }
            throw new Error(
              "No whole-word phrase fits these settings. Increase the length or turn off the number or symbol.",
            );
          }
        }

        class PassphrasePolicy {
          validate(options) {
            const { min, max } = PASSWORD_LENGTH;
            if (
              !Number.isInteger(options.length) ||
              options.length < min ||
              options.length > max
            )
              throw new RangeError(
                `Choose a whole number from ${min} to ${max}.`,
              );
            if (!["-", ".", "_", " "].includes(options.separator))
              throw new Error("Choose a supported word separator.");
            if (!["story", "random", "characters"].includes(options.style))
              throw new Error("Choose a supported phrase style.");
            if (!["everyday", "expanded"].includes(options.vocabulary))
              throw new Error("Choose a supported vocabulary.");
            for (const key of [
              "capitalize",
              "includeNumber",
              "includeSymbol",
            ]) {
              if (typeof options[key] !== "boolean")
                throw new TypeError("Invalid passphrase settings.");
            }
            return Object.freeze({ ...options });
          }
        }

        class WordLayout {
          static count(wordCount, options) {
            const boundaries = BigInt(wordCount * 2);
            return options.includeNumber && options.includeSymbol
              ? boundaries * (boundaries + 1n)
              : options.includeNumber || options.includeSymbol
                ? boundaries
                : 1n;
          }

          static render(words, number, symbol, separator, rank) {
            const boundaries = words.length * 2;
            const slots = Array.from({ length: boundaries }, () => []);
            if (number && symbol) {
              const numberSlot = Number(rank / BigInt(boundaries + 1));
              const symbolChoice = Number(rank % BigInt(boundaries + 1));
              slots[numberSlot].push({ value: number, kind: "number" });
              if (symbolChoice === boundaries)
                slots[numberSlot].push({ value: symbol, kind: "symbol" });
              else
                slots[symbolChoice].unshift({ value: symbol, kind: "symbol" });
            } else if (number || symbol) {
              slots[Number(rank)].push({
                value: number || symbol,
                kind: number ? "number" : "symbol",
              });
            }
            const tokens = [];
            words.forEach((word, index) => {
              if (index) tokens.push({ value: separator, kind: "separator" });
              tokens.push(
                ...slots[index * 2],
                { value: word, kind: "word" },
                ...slots[index * 2 + 1],
              );
            });
            return tokens;
          }
        }

        class CharacterGenerator {
          constructor(random) {
            this.random = random;
          }

          groups(options) {
            const groups = [Array.from("abcdefghijklmnopqrstuvwxyz")];
            if (options.capitalize)
              groups.push(Array.from("ABCDEFGHIJKLMNOPQRSTUVWXYZ"));
            if (options.includeNumber) groups.push(Array.from("0123456789"));
            if (options.includeSymbol) groups.push(CHARACTER_SYMBOLS);
            return groups;
          }

          count(groups, length) {
            let total = 0n;
            const size = groups.reduce((sum, group) => sum + group.length, 0);
            for (let mask = 0; mask < 1 << groups.length; mask += 1) {
              let removed = 0;
              let exclusions = 0;
              groups.forEach((group, index) => {
                if (mask & (1 << index)) {
                  removed += group.length;
                  exclusions += 1;
                }
              });
              const ways = BigInt(size - removed) ** BigInt(length);
              total += exclusions % 2 ? -ways : ways;
            }
            return total;
          }

          generate(options) {
            const groups = this.groups(options);
            const alphabet = groups.flat();
            let values;
            do {
              values = Array.from(
                { length: options.length },
                () => alphabet[this.random.integer(alphabet.length)],
              );
            } while (
              !groups.every((group) =>
                values.some((value) => group.includes(value)),
              )
            );
            const tokens = values.map((value) => ({
              value,
              kind: /[0-9]/.test(value)
                ? "number"
                : /[a-z]/i.test(value)
                  ? "word"
                  : "symbol",
            }));
            return Object.freeze({
              value: values.join(""),
              tokens,
              words: [],
              number: "",
              symbol: "",
              options,
              combinations: this.count(groups, options.length),
              kind: "characters",
              alphabetSize: alphabet.length,
            });
          }
        }

        class PassphraseGenerator {
          constructor(
            random,
            planner,
            policy,
            symbols,
            characterGenerator = new CharacterGenerator(random),
          ) {
            this.random = random;
            this.planner = planner;
            this.policy = policy;
            this.symbols = symbols;
            this.characterGenerator = characterGenerator;
          }

          generate(settings) {
            const options = this.policy.validate(settings);
            if (options.style === "characters")
              return this.characterGenerator.generate(options);
            const suffixLength =
              (options.includeNumber ? 2 : 0) + (options.includeSymbol ? 1 : 0);
            const budget = options.length - suffixLength;
            const plan = this.planner.plan(options, budget);
            let rank = this.random.bigInt(plan.total);
            let selected;
            for (const entry of plan.entries) {
              if (rank < entry.count) {
                selected = entry;
                break;
              }
              rank -= entry.count;
            }
            const caseMask = options.capitalize
              ? (rank % selected.cases) + 1n
              : 0n;
            const layoutRank = (rank / selected.cases) % selected.layouts;
            const wordRank = rank / (selected.cases * selected.layouts);
            const words = selected.space
              .unrank(wordRank, budget)
              .map((word, index) =>
                caseMask & (1n << BigInt(index))
                  ? word[0].toUpperCase() + word.slice(1)
                  : word,
              );
            const number = options.includeNumber
              ? String(this.random.integer(100)).padStart(2, "0")
              : "";
            const symbol = options.includeSymbol
              ? this.symbols[this.random.integer(this.symbols.length)]
              : "";
            const tokens = WordLayout.render(
              words,
              number,
              symbol,
              options.separator,
              layoutRank,
            );
            const value = tokens.map((token) => token.value).join("");
            if (value.length !== options.length)
              throw new Error("The requested length could not be matched.");
            const combinations =
              plan.total *
              (options.includeNumber ? 100n : 1n) *
              (options.includeSymbol ? BigInt(this.symbols.length) : 1n);
            return Object.freeze({
              value,
              tokens,
              words: Object.freeze(words),
              number,
              symbol,
              options,
              combinations,
              kind: selected.space.kind,
            });
          }
        }

        class EntropyEstimator {
          estimate(result) {
            const bits = Math.log2(Number(result.combinations));
            const equivalentLength = Math.floor(bits / Math.log2(94));
            const label =
              bits >= 128
                ? "Very strong"
                : bits >= 100
                  ? "Extra strong"
                  : bits >= 80
                    ? "Strong"
                    : bits >= 60
                      ? "Moderate"
                      : "Weak";
            return Object.freeze({
              bits,
              equivalentLength,
              label,
              level: bits >= 80 ? "strong" : bits >= 60 ? "moderate" : "weak",
            });
          }
        }

        class BrowserClipboard {
          constructor(navigatorProvider, documentProvider) {
            this.navigator = navigatorProvider;
            this.document = documentProvider;
          }

          async copy(value) {
            try {
              if (
                this.navigator.clipboard &&
                typeof this.navigator.clipboard.writeText === "function"
              ) {
                await this.navigator.clipboard.writeText(value);
                return;
              }
            } catch {}
            const activeElement = this.document.activeElement;
            const textarea = this.document.createElement("textarea");
            textarea.value = value;
            textarea.className = "clipboard-helper";
            textarea.setAttribute("readonly", "");
            textarea.setAttribute("aria-label", "Copy passphrase");
            this.document.body.append(textarea);
            try {
              textarea.focus();
              textarea.select();
              textarea.setSelectionRange(0, value.length);
              if (!this.document.execCommand("copy")) {
                throw new Error(
                  "Clipboard access is blocked. Reveal and select the passphrase, then use your device's Copy command.",
                );
              }
            } finally {
              textarea.value = "";
              textarea.remove();
              activeElement?.focus({ preventScroll: true });
            }
          }
        }

        class GeneratorView {
          constructor(documentProvider) {
            this.document = documentProvider;
            this.elements = Object.fromEntries(
              [
                "settings-form",
                "password-length",
                "length-range",
                "phrase-style",
                "vocabulary",
                "memory-cue",
                "separator",
                "capitalize",
                "include-number",
                "include-symbol",
                "password-display",
                "visibility-button",
                "copy-button",
                "copy-label",
                "generate-button",
                "entropy-value",
                "strength-meter",
                "strength-badge",
                "feedback",
                "uppercase-label",
                "number-label",
                "symbol-label",
              ].map((id) => [id, this.document.getElementById(id)]),
            );
          }

          bind(handlers) {
            const length = this.elements["password-length"];
            const range = this.elements["length-range"];
            const { min, max, initial } = PASSWORD_LENGTH;
            for (const input of [length, range]) {
              input.min = min;
              input.max = max;
              input.defaultValue = initial;
              input.valueAsNumber = initial;
            }

            this.elements["generate-button"].addEventListener("click", () =>
              handlers.generate(true),
            );
            this.elements["copy-button"].addEventListener(
              "click",
              handlers.copy,
            );
            this.elements["visibility-button"].addEventListener(
              "click",
              handlers.toggleVisibility,
            );
            this.elements["settings-form"].addEventListener("submit", (event) =>
              event.preventDefault(),
            );
            range.addEventListener("input", () => {
              length.value = range.value;
              handlers.generate();
            });
            length.addEventListener("input", () => {
              if (length.validity.valid) range.value = length.value;
              handlers.generate();
            });
            this.elements["settings-form"].addEventListener(
              "change",
              (event) => {
                if (event.target === length || event.target === range) return;
                this.syncControls();
                handlers.generate();
              },
            );
          }

          syncControls() {
            const characters =
              this.elements["phrase-style"].value === "characters";
            this.elements.vocabulary.disabled = characters;
            this.elements.separator.disabled = characters;
            this.elements["uppercase-label"].textContent = characters
              ? "Include uppercase"
              : "Random word initials";
            this.elements["number-label"].textContent = characters
              ? "Include digits"
              : "Add a number";
            this.elements["symbol-label"].textContent = characters
              ? "Include symbols"
              : "Add a symbol";
          }

          readOptions() {
            return {
              length: this.elements["password-length"].valueAsNumber,
              style: this.elements["phrase-style"].value,
              vocabulary: this.elements.vocabulary.value,
              separator: this.elements.separator.value,
              capitalize: this.elements.capitalize.checked,
              includeNumber: this.elements["include-number"].checked,
              includeSymbol: this.elements["include-symbol"].checked,
            };
          }

          render(result, estimate, hidden) {
            this.renderPassword(result, hidden);
            this.elements["entropy-value"].textContent =
              estimate.bits.toFixed(1);
            this.elements["strength-meter"].max = Math.max(
              128,
              Math.ceil(estimate.bits / 32) * 32,
            );
            this.elements["strength-meter"].value = estimate.bits;
            this.elements["strength-meter"].setAttribute(
              "aria-valuetext",
              `${estimate.bits.toFixed(1)} bits of entropy`,
            );
            this.elements["strength-badge"].textContent = estimate.label;
            this.elements["strength-badge"].dataset.level = estimate.level;
            this.elements["copy-button"].disabled = false;
            this.elements["visibility-button"].disabled = false;
            this.elements["generate-button"].disabled = false;
          }

          renderPassword(result, hidden) {
            const output = this.elements["password-display"];
            const cue = this.elements["memory-cue"];
            cue.hidden = hidden || result.options.style !== "story";
            const scene = cue.hidden
              ? ""
              : result.words.join(" ").toLowerCase();
            cue.textContent = scene
              ? scene[0].toUpperCase() + scene.slice(1) + "."
              : "";
            output.classList.remove("is-error");
            output.classList.toggle("is-hidden", hidden);
            output.replaceChildren();
            if (hidden) {
              output.textContent = "•••• •••• ••••";
              output.setAttribute("aria-label", "Passphrase hidden");
            } else {
              output.setAttribute("aria-label", "Generated passphrase");
              const append = (text, kind) => {
                const span = this.document.createElement("span");
                span.className = `token-${kind}`;
                span.textContent = text;
                output.append(span);
              };
              result.tokens.forEach((token) => {
                append(token.value, token.kind);
                if (token.kind === "separator")
                  output.append(this.document.createElement("wbr"));
              });
            }
            const button = this.elements["visibility-button"];
            const label = hidden ? "Show passphrase" : "Hide passphrase";
            button.setAttribute("aria-pressed", String(hidden));
            button.setAttribute("aria-label", label);
            button.title = label;
          }

          setFeedback(message, tone = "normal") {
            this.elements.feedback.textContent = message;
            this.elements.feedback.dataset.tone = tone;
          }

          setCopyState(state) {
            this.elements["copy-label"].textContent =
              state === "copied"
                ? "Copied"
                : state === "pending"
                  ? "Copying…"
                  : "Copy";
            this.elements["copy-button"].disabled = state === "pending";
          }

          showError(message) {
            this.elements["password-display"].textContent =
              "Passphrase unavailable";
            this.elements["password-display"].classList.remove("is-hidden");
            this.elements["password-display"].classList.add("is-error");
            this.elements["password-display"].setAttribute(
              "aria-label",
              "Passphrase unavailable",
            );
            this.elements["copy-button"].disabled = true;
            this.elements["copy-label"].textContent = "Copy";
            this.elements["visibility-button"].disabled = true;
            this.elements["generate-button"].disabled = false;
            this.elements["strength-badge"].textContent = "Unavailable";
            this.elements["strength-badge"].dataset.level = "moderate";
            this.elements["strength-meter"].value = 0;
            this.elements["strength-meter"].setAttribute(
              "aria-valuetext",
              "Unavailable",
            );
            this.elements["entropy-value"].textContent = "—";
            this.elements["memory-cue"].hidden = true;
            this.elements["memory-cue"].textContent = "";
            this.setFeedback(message, "error");
          }
        }

        class GeneratorController {
          constructor(generator, estimator, clipboard, view) {
            this.generator = generator;
            this.estimator = estimator;
            this.clipboard = clipboard;
            this.view = view;
            this.result = null;
            this.hidden = false;
            this.feedbackTimer = null;
            this.copyVersion = 0;
          }

          start() {
            this.view.bind({
              generate: (announce) => this.generate(announce),
              copy: () => this.copy(),
              toggleVisibility: () => this.toggleVisibility(),
            });
            this.view.syncControls();
            this.generate();
          }

          generate(announce = false) {
            clearTimeout(this.feedbackTimer);
            this.copyVersion += 1;
            this.view.setCopyState("idle");
            try {
              this.result = this.generator.generate(this.view.readOptions());
              const estimate = this.estimator.estimate(this.result);
              this.view.render(this.result, estimate, this.hidden);
              this.view.setFeedback(announce ? "Password generated." : "");
            } catch (error) {
              this.result = null;
              this.view.showError(
                error.message || "Secure generation failed. Please try again.",
              );
            }
          }

          toggleVisibility() {
            if (!this.result) return;
            this.hidden = !this.hidden;
            this.view.renderPassword(this.result, this.hidden);
          }

          async copy() {
            if (!this.result) return;
            const value = this.result.value;
            const version = ++this.copyVersion;
            clearTimeout(this.feedbackTimer);
            this.view.setCopyState("pending");
            try {
              await this.clipboard.copy(value);
              if (version !== this.copyVersion) return;
              this.view.setCopyState("copied");
              this.view.setFeedback("Copied to clipboard.", "success");
              this.feedbackTimer = setTimeout(() => {
                this.view.setCopyState("idle");
                this.view.setFeedback("");
              }, 3500);
            } catch (error) {
              if (version !== this.copyVersion) return;
              this.view.setCopyState("idle");
              this.view.setFeedback(
                error.message ||
                  "Copy failed. Select the passphrase and copy it manually.",
                "error",
              );
            }
          }
        }

        if (typeof module !== "undefined" && module.exports) {
          module.exports = {
            LEXICON,
            DICTIONARY_STATS,
            SYMBOLS,
            CHARACTER_SYMBOLS,
            CryptoRandom,
            WordPool,
            WordRepository,
            SequenceSpace,
            PhrasePlanner,
            WordLayout,
            CharacterGenerator,
            PassphrasePolicy,
            PassphraseGenerator,
            EntropyEstimator,
            BrowserClipboard,
            GeneratorController,
          };
        }

        if (typeof document !== "undefined") {
          const view = new GeneratorView(document);
          try {
            const planner = new PhrasePlanner(LEXICON);
            const generator = new PassphraseGenerator(
              new CryptoRandom(globalThis.crypto),
              planner,
              new PassphrasePolicy(),
              SYMBOLS,
            );
            const estimator = new EntropyEstimator();
            const clipboard = new BrowserClipboard(navigator, document);
            new GeneratorController(
              generator,
              estimator,
              clipboard,
              view,
            ).start();
          } catch (error) {
            view.showError(error.message || "The generator could not start.");
          }
        }
      })();
    </script>
  </body>
</html>
