name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the site and release rules
        run: node --test
      - name: Assemble the static site
        run: |
          mkdir -p _site/password-generator
          cp index.html favicon.png _site/
          cp password-generator/index.html _site/password-generator/
      - name: Check GitHub Pages status
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_pages')
          printf 'enabled=%s\n' "$enabled" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    if: needs.verify.outputs.pages-enabled == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check the current master revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')
          if [ "$head" = "$GITHUB_SHA" ]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to GitHub Pages
        if: steps.revision.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
